<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canary Commons — Formation Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2A47;
    --gold: #FFD86B;
    --cream: #fff8e0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    color: var(--cream);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
  }

  .proto-badge {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 50;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,248,224,0.35);
    border: 1px solid rgba(255,248,224,0.18);
    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 600;
    pointer-events: none;
  }

  .compass {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    z-index: 40;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(90,135,195,0.55) 0%, rgba(40,68,115,0.75) 55%, rgba(14,32,60,0.9) 100%);
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(140,185,240,0.15),
      0 2px 10px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .replay-btn {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(255,248,224,0.55);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,248,224,0.22);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .replay-btn:hover {
    color: var(--gold);
    border-color: rgba(255,216,107,0.5);
    background: rgba(255,255,255,0.1);
  }

  .compass span {
    font-size: 20px;
    color: var(--gold);
    filter: drop-shadow(0 0 5px rgba(255,216,107,0.55));
    line-height: 1;
    transform: translateY(-1px);
  }

  #sky-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    display: block;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(400px, 54vh, 600px) 24px 80px;
  }

  .identity {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,248,224,0.46);
    margin: 0 0 30px;
  }

  .supporting {
    max-width: 480px;
    margin: 0 auto 22px;
    font-size: clamp(0.98rem, 1.25vw, 1.08rem);
    font-weight: 400;
    line-height: 1.65;
    color: rgba(255,248,224,0.72);
  }

  .question {
    max-width: 740px;
    margin: 0 auto 44px;
    font-size: clamp(2rem, 4.6vw, 3.1rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.22;
    color: #fffdf6;
  }

  .action {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 2px solid rgba(255,216,107,0.55);
    padding-bottom: 6px;
    transition: border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
  }
  .action:hover {
    border-bottom-color: var(--gold);
    color: #ffe9ad;
  }
  .action .cta-bird {
    height: 1.5em;
    width: auto;
    display: inline-block;
    transform: translateY(1px);
  }
</style>
</head>
<body>

  <div class="proto-badge">Prototype — formation animation — not live</div>

  <button class="replay-btn" id="replay-btn" type="button">↻ Replay animation</button>

  <div class="compass" aria-hidden="true"><span>✦</span></div>

  <canvas id="sky-canvas" aria-label="A night sky from which the Canary emerges"></canvas>

  <main>
    <div class="identity">Canary Commons</div>

    <p class="supporting">
      They put her in the coal mine because she was sensitive enough to know something was wrong.
    </p>

    const cache = new Map();
    function cellValue(cx, cy) {
      const key = cx + ',' + cy;
      let v = cache.get(key);
      if (v === undefined) { v = rndN(); cache.set(key, v); }
      return v;
    }
    return function (px, py) {
      const gx = px / cellPx, gy = py / cellPx;
      const x0 = Math.floor(gx), y0 = Math.floor(gy);
      const tx = gx - x0, ty = gy - y0;
      const v00 = cellValue(x0, y0), v10 = cellValue(x0 + 1, y0);
      const v01 = cellValue(x0, y0 + 1), v11 = cellValue(x0 + 1, y0 + 1);
      const top = v00 + (v10 - v00) * tx;
      const bot = v01 + (v11 - v01) * tx;
      return top + (bot - top) * ty;
    };
  }
  const fieldNoise = makeFieldNoise(917, 420);

  // Background starfield: a genuine sky, spread across the whole visual
  // field — not concentrated around the bird's footprint, and never
  // moves. This is the "larger constellation" the Canary gathers out of;
  // only DATA.points (below) ever travel. Brightness is drawn from a
  // skewed distribution (many faint, fewer medium, rare bright) rather
  // than a handful of discrete buckets, so it reads as sky, not pattern.
  const bgStars = [];
  const BG_CANDIDATES = 1500;
  for (let i = 0; i < BG_CANDIDATES; i++) {
    const px = rnd() * canvas.width;
    const py = rnd() * canvas.height;
    const density = 0.6 + 0.6 * fieldNoise(px, py); // subtle, ~0.6x-1.2x
    if (rnd() >= density * 0.58) continue; // irregular, not uniform

    const b = Math.pow(rnd(), 3.2); // skewed toward faint
    const sizeJitter = 0.82 + rnd() * 0.45;
    let tier, r, alpha;
    if (b > 0.82) {
      tier = 'bright';
      r = (1.7 + b * 1.6) * sizeJitter;
      alpha = 0.82 + (b - 0.82) / 0.18 * 0.18;
    } else if (b > 0.45) {
      tier = 'soft';
      r = (0.85 + b * 1.1) * sizeJitter;
      alpha = 0.48 + (b - 0.45) / 0.37 * 0.34;
    } else {
      tier = 'point';
      r = (0.4 + b * 0.7) * sizeJitter;
      alpha = 0.2 + b * 0.46;
    }
    bgStars.push({ x: px / canvas.width, y: py / canvas.height, r, alpha, tier });
  }

  function drawBackgroundStars() {
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const cx = s.x * canvas.width;
      const cy = s.y * canvas.height;
      const d = s.r * designScale * 13;
      const sprite = s.tier === 'bright' ? bgSpriteBright : s.tier === 'soft' ? bgSpriteSoft : bgSpritePoint;
      ctx.globalAlpha = s.alpha;
      ctx.drawImage(sprite, cx - d / 2, cy - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  // Initial scatter: spread across a wide span of the full sky — these
  // points start indistinguishable from the ordinary background stars,
  // not confined to a patch near where the bird will resolve.
  const scatterSpan = Math.min(canvas.width, canvas.height);
  const scatterCenter = { x: canvas.width * 0.5, y: canvas.height * 0.4 };
  const scatterR = { x: scatterSpan * 0.62, y: scatterSpan * 0.56 };

  const pts = DATA.points.map((p) => {
    const u = rnd();
    const ang = rnd() * Math.PI * 2;
    const rad = Math.sqrt(u);
    const x0 = scatterCenter.x + Math.cos(ang) * scatterR.x * rad;
    const y0 = scatterCenter.y + Math.sin(ang) * scatterR.y * rad;
    return {
      x0, y0,
      x1: birdRect.x + p.x * birdRect.w,
      y1: birdRect.y + p.y * birdRect.h,
      r: p.r, peak: p.peak, bucket: p.b,
      delay: rnd() * 1750,
      dur: 2900 + rnd() * 1500,
    };
  });

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // A full, still beat of night sky before anything begins to move.
  const HOLD_MS = 1300;

  let startTime = null;
  const designScale = birdRect.w / 1100;

  function frame(ts) {
    if (startTime === null) startTime = ts;
    const elapsed = ts - startTime - HOLD_MS;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0F2A47';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawBackgroundStars();

    let stillAnimating = false;

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let t = (elapsed - p.delay) / p.dur;
      if (t < 1) stillAnimating = true;
      t = Math.min(1, Math.max(0, t));
      const e = easeInOutCubic(t);

      const cx = p.x0 + (p.x1 - p.x0) * e;
      const cy = p.y0 + (p.y1 - p.y0) * e;

      // Before they gather, these points sit closer to ordinary
      // background-star brightness — they visibly warm up and brighten
      // as they arrive, rather than already looking "special" at rest.
      const sizeMix = 0.42 + 0.58 * e;
      const peakMix = 0.4 + 0.6 * e;
      const radiusPx = p.r * designScale * sizeMix;
      const alpha = p.peak * peakMix;

      const drawSize = radiusPx * 2 * GLOW_RATIO;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprites[p.bucket], cx - drawSize / 2, cy - drawSize / 2, drawSize, drawSize);
    }
    ctx.globalAlpha = 1;

    if (stillAnimating) {
      requestAnimationFrame(frame);
    } else {
      animRunning = false;
    }
    // Once every point has arrived, the loop simply stops — the last
    // drawn frame is the resting constellation, with no further motion,
    // until Replay is pressed.
  }

  let animRunning = true;
  requestAnimationFrame(frame);

  document.getElementById('replay-btn').addEventListener('click', () => {
    startTime = null;
    if (!animRunning) {
      animRunning = true;
      requestAnimationFrame(frame);
    }
    // If it's still mid-flight, the already-scheduled loop will pick up
    // the reset startTime on its next frame — no second loop needed.
  });
})();
</script>
</body>
</html>
