<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canary Commons — Homepage Mockup (Constellation)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #08192D;
    --gold: #FFD86B;
    --cream: #fff8e0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    color: var(--cream);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
  }

  .proto-badge {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 50;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,248,224,0.35);
    border: 1px solid rgba(255,248,224,0.18);
    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 600;
    pointer-events: none;
  }

  /* ── Quiet compass nav placeholder, upper right ── */
  .compass {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    z-index: 40;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(90,135,195,0.55) 0%, rgba(40,68,115,0.75) 55%, rgba(14,32,60,0.9) 100%);
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(140,185,240,0.15),
      0 2px 10px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .compass span {
    font-size: 20px;
    color: var(--gold);
    filter: drop-shadow(0 0 5px rgba(255,216,107,0.55));
    line-height: 1;
    transform: translateY(-1px);
  }

  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px 24px 80px;
  }

  .identity {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,248,224,0.46);
    margin: 0 0 30px;
  }

  .constellation-img {
    width: clamp(260px, 34vw, 440px);
    height: auto;
    display: block;
    margin: 0 auto 40px;
  }

  .supporting {
    max-width: 480px;
    margin: 0 auto 22px;
    font-size: clamp(0.98rem, 1.25vw, 1.08rem);
    font-weight: 400;
    line-height: 1.65;
    color: rgba(255,248,224,0.72);
  }

  .question {
    max-width: 740px;
    margin: 0 auto 44px;
    font-size: clamp(2rem, 4.6vw, 3.1rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.22;
    color: #fffdf6;
  }

  .action {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 2px solid rgba(255,216,107,0.55);
    padding-bottom: 6px;
    transition: border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
  }
  .action:hover {
    border-bottom-color: var(--gold);
    color: #ffe9ad;
  }
</style>
</head>
